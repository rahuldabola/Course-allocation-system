[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency injection relies on `Depends(...)` as an
# argument default; that's the framework's intended usage, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
