[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency injection relies on `Depends(...)` as an
# argument default; that's the framework's intended usage, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `from app...` resolve regardless of how pytest is invoked (bare
# `pytest` doesn't prepend cwd to sys.path the way `python -m pytest` does).
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
