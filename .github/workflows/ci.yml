name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend · lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  backend-test:
    name: Backend · tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Unit, API and property tests (SQLite, with coverage gate)
        if: matrix.db == 'sqlite'
        run: pytest -q --cov --cov-report=term --cov-report=xml

      - name: Same suite against Postgres
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        run: pytest -q

      - name: Migrations — upgrade, drift check, downgrade (SQLite)
        if: matrix.db == 'sqlite'
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Migrations — upgrade, drift check, downgrade (Postgres)
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    name: Frontend · lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    env:
      DATABASE_URL: sqlite:///./e2e.db
      DEMO_MODE: "true"
      LLM_PROVIDER: none
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: e2e-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start API (demo data, no LLM)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          timeout 60 bash -c 'until curl -sf localhost:8000/health; do sleep 1; done'

      - name: Build and start web app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          nohup node .next/standalone/server.js > web.log 2>&1 &
          timeout 60 bash -c 'until curl -sf localhost:3000/login > /dev/null; do sleep 1; done'

      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload report and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/api.log
            frontend/web.log
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
